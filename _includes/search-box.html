<div class="relative w-full max-w-xl">
  <label for="{{ include.id }}" class="sr-only">Search states, counties, and departments</label>
  <input
    id="{{ include.id }}"
    type="search"
    autocomplete="off"
    placeholder="Search states, counties, or departments..."
    aria-controls="{{ include.id }}-results"
    data-directory-search
    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm placeholder:text-slate-500 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
  >
  <ul
    id="{{ include.id }}-results"
    aria-label="Search results"
    aria-live="polite"
    data-search-results
    hidden
    class="absolute z-20 mt-1 max-h-80 w-full overflow-y-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg"
  ></ul>
</div>
